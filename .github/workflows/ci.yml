name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # CPU-only torch keeps the job small and fast; we never train in CI.
        run: |
          uv venv
          uv pip install --torch-backend=cpu -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        run: uv run pytest -q
